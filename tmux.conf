# --- General Settings ---
set -g mouse on
set -g status-position top
set -g base-index 1          # Start windows at 1 for easier switching
setw -g pane-base-index 1     # Start panes at 1
set -g renumber-windows on    # Automatically renumber windows when one is closed

# Change prefix to Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Reload config file shortcut
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Split panes using | and - (opens in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Terminal & Colors ---
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"

# Styling the pane borders
set -g pane-active-border-style "fg=magenta,bg=default"
set -g pane-border-style "fg=brightblack,bg=default"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # Saves sessions
set -g @plugin 'tmux-plugins/tmux-continuum' # Auto-restores sessions

# --- Dracula Theme Settings ---
set -g @plugin 'dracula/tmux'
set -g @dracula-show-powerline true
set -g @dracula-show-flags true
set -g @dracula-show-left-icon session

# Modern rounded separators (Requires a Nerd Font)
set -g @dracula-show-left-sep 
set -g @dracula-show-right-sep 

# Plugin list and customization
set -g @dracula-plugins "cpu-usage ram-usage network battery"
set -g @dracula-network-colors "cyan dark_gray"
set -g @dracula-battery-label "BAT"
set -g @dracula-refresh-rate 5

# Auto-restore session on tmux start
set -g @continuum-restore 'on'

# --- Initialize TPM (MUST be at the very bottom) ---
run '~/.tmux/plugins/tpm/tpm'
